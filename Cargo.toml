[package]
name = "nekodash"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = ["crates/nekodash-core"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "=1.18.1"
nekodash-core = { path = "crates/nekodash-core" }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
