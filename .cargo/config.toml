[target.x86_64-pc-windows-msvc]
# Increase default stack size to avoid running out of stack
# space in debug builds. The size matches Linux's default.
rustflags = [
    "-C", "link-arg=/STACK:8000000"
]
[target.aarch64-pc-windows-msvc]
# Increase default stack size to avoid running out of stack
# space in debug builds. The size matches Linux's default.
rustflags = [
    "-C", "link-arg=/STACK:8000000"
]
[env]
# The pinned Slint widget sources use interfaces and internal menu components.
# Enable the same compiler facilities when loading our palette-adapted copies.
SLINT_ENABLE_EXPERIMENTAL_FEATURES = "1"
