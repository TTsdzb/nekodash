name: Release

on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      android:
        description: Build and sign Android APK (requires signing Secrets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  desktop:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - os: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target '${{ matrix.target }}'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libudev-dev
      - name: Build
        run: cargo +"$RUST_TOOLCHAIN" build --release --locked -p nekodash --bin nekodash --target '${{ matrix.target }}'
      - name: Package
        run: python3 scripts/package_desktop.py '${{ matrix.target }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android:
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 29.0.14206865
      ANDROID_BUILD_TOOLS: 35.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions Secret: $name (see docs/releases.md)"
              exit 1
            fi
          done
      - name: Toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-android-${{ env.NDK_VERSION }}
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1 ndk;29.0.14206865'
      - name: APK build tool
        run: cargo +"$RUST_TOOLCHAIN" install cargo-apk --version 0.10.0 --locked
      - name: Build APK
        run: bash scripts/build_android.sh
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/sign_android.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          test -s NekoDash-linux-x86_64.tar.gz
          test -s NekoDash-windows-x86_64.zip
          test -s NekoDash-macos-aarch64.zip
          test -s NekoDash-macos-x86_64.zip
          test -s NekoDash-android-arm64-v8a.apk
          sha256sum NekoDash-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
