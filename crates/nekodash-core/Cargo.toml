[package]
name = "nekodash-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Async client and connection lifecycle for Mihomo dashboards"

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }
tempfile = "3"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
rcgen = "0.12.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "process", "io-util"] }
